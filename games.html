<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Игри - Да учим с Бъни</title>
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>

<script src="js/auth.js?v=4"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const role = getRole(); // Взема текущата роля

    // Навигация според ролята
    const nav = document.querySelector(".nav");
    if(role === "user") {
        nav.innerHTML = `
            <a href="index.html">Начало</a>
            <a href="games.html" class="active">Игри</a>
            <a href="#" onclick="logout()">Изход</a>
        `;
    } else if(role === "admin") {
        nav.innerHTML = `
            <a href="index.html">Начало</a>
            <a href="games.html" class="active">Игри</a>
            <a href="admin.html">Админ панел</a>
            <a href="#" onclick="logout()">Изход</a>
        `;
    } else {
        // гост
        nav.innerHTML = `
            <a href="index.html">Начало</a>
            <a href="games.html" class="active">Игри</a>
            <a href="login.html">Вход</a>
            <a href="register.html">Регистрация</a>
        `;
    }

    // Контрол на бутоните за гост
    if(role === "guest") {
        const buttons = document.querySelectorAll(".game-card a.btn");
        buttons.forEach(btn => {
            btn.addEventListener("click", function(e) {
                e.preventDefault();
                alert("Само регистрирани потребители имат достъп до игрите. Моля, влезте или се регистрирайте.");
            });
        });
    }
});
</script>

<body>

<header class="header">
    <div class="logo-area">
        <img src="assets/images/logo.png" alt="Лого Бъни" class="logo">
    </div>
    <nav class="nav">
        <a href="index.html">Начало</a>
        <a href="games.html" class="active">Игри</a>
        <a href="login.html">Вход</a>
        <a href="register.html">Регистрация</a>
    </nav>
</header>

<section class="games-section">
    <div class="white-card">
        <h2>Игри с Бъни</h2>
        <div class="games-container">
            <div class="game-card">
                <h3>Игра 1</h3>
                <p>Описание на играта.</p>
                <a href="#" class="btn">Играй</a>
            </div>
            <div class="game-card">
                <h3>Игра 2</h3>
                <p>Описание на играта.</p>
                <a href="#" class="btn">Играй</a>
            </div>
            <div class="game-card">
                <h3>Игра 3</h3>
                <p>Описание на играта.</p>
                <a href="#" class="btn">Играй</a>
            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Да учим с Бъни</p>
</footer>

</body>
</html>
