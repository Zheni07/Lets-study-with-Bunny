<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Статия - Да учим с Бъни</title>
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<script src="js/auth.js?v=4"></script>

<header class="header">
    <div class="logo-area">
        <img src="assets/images/logo.png" alt="Лого" class="logo">
    </div>
    <nav class="nav" id="nav"></nav>
</header>

<main class="white-card" style="max-width: 800px; margin: 2rem auto; padding: 2rem;">
    <div id="article-loading">Зареждане...</div>
    <div id="article-error" class="message error" style="display: none;"></div>
    <article id="article-content" style="display: none;">
        <h1 id="article-title"></h1>
        <p class="article-meta" id="article-meta"></p>
        <div id="article-body" class="article-body"></div>
    </article>
</main>

<footer>
    <div class="footer-inner">
        <div class="footer-grid">
            <div class="footer-brand">
                <div class="footer-title">Да учим с Бъни</div>
                <div class="footer-desc">
                    Игри и полезни материали за подкрепа на деца с трудности при четене и писане.
                </div>
                <div class="footer-badges">
                    <span class="footer-badge">Дислексия • подкрепа</span>
                    <span class="footer-badge">Игри • обучение</span>
                </div>
            </div>

            <div class="footer-col">
                <h4>Бързи връзки</h4>
                <ul class="footer-links">
                    <li><a href="index.html">Начало</a></li>
                    <li><a href="games.html">Игри</a></li>
                    <li><a href="index.html#articles">Статии</a></li>
                    <li><a href="index.html#contact">Контакт</a></li>
                </ul>
            </div>

            <div class="footer-col">
                <h4>Профил</h4>
                <ul class="footer-links">
                    <li><a href="login.html">Вход</a></li>
                    <li><a href="register.html">Регистрация</a></li>
                    <li><a href="forgot-password.html">Забравена парола</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-meta">
            <div>© 2026 Да учим с Бъни</div>
            <div class="footer-badges">
                <a class="footer-badge" href="index.html#contact">Свържи се</a>
                <a class="footer-badge" href="games.html">Играй</a>
            </div>
        </div>
    </div>
</footer>

<script>
(function() {
    var api = (typeof getApiBase === "function" ? getApiBase() : (window.location.protocol + "//" + window.location.hostname + ":4000/api"));
    var baseUrl = (window.location.protocol + "//" + window.location.hostname + ":4000");
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var loading = document.getElementById("article-loading");
    var error = document.getElementById("article-error");
    var content = document.getElementById("article-content");

    function setNav() {
        var role = getRole();
        var nav = document.getElementById("nav");
        if (role === "guest") {
            nav.innerHTML = '<a href="index.html">Начало</a><a href="games.html">Игри</a><a href="login.html">Вход</a><a href="register.html">Регистрация</a>';
        } else if (role === "user") {
            nav.innerHTML = '<a href="index.html">Начало</a><a href="games.html">Игри</a><a href="#" onclick="logout()">Изход</a>';
        } else if (role === "admin") {
            nav.innerHTML = '<a href="index.html">Начало</a><a href="games.html">Игри</a><a href="admin.html?v=2">Админ панел</a><a href="#" onclick="logout()">Изход</a>';
        }
    }
    setNav();

    if (!id) {
        loading.style.display = "none";
        error.textContent = "Няма избрана статия.";
        error.style.display = "block";
        return;
    }

    fetch(api + "/articles/" + id, { method: "GET", credentials: "omit" })
        .then(function(r) {
            if (!r.ok) throw new Error("API " + r.status);
            return r.json();
        })
        .then(function(data) {
            loading.style.display = "none";
            if (data.error || !data.article) {
                error.textContent = data.error && data.error.message ? data.error.message : "Статията не е намерена.";
                error.style.display = "block";
                return;
            }
            var a = data.article;
            document.getElementById("article-title").textContent = a.title || "";
            var date = a.createdAt ? new Date(a.createdAt).toLocaleDateString("bg-BG") : "";
            document.getElementById("article-meta").textContent = date + (a.author ? " — " + a.author : "");
            var body = document.getElementById("article-body");
            if (a.image) {
                var img = document.createElement("img");
                img.src = a.image.indexOf("http") === 0 ? a.image : baseUrl + (a.image.indexOf("/") === 0 ? "" : "/") + a.image;
                img.alt = a.title || "";
                img.addEventListener("error", function() {
                    // If the file was deleted or missing, hide the broken image icon
                    if (img && img.parentNode) img.parentNode.removeChild(img);
                });
                body.appendChild(img);
            }
            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function renderArticleBody(raw) {
                var text = (raw || "").replace(/\r\n/g, "\n").trim();
                if (!text) return "";

                var blocks = text.split(/\n{2,}/g);
                var html = [];

                for (var i = 0; i < blocks.length; i++) {
                    var block = blocks[i].trim();
                    if (!block) continue;

                    // Simple bullet list support: lines starting with "- " or "• "
                    var lines = block.split("\n");
                    var allBullets = lines.length > 1 && lines.every(function(l) {
                        var t = l.trim();
                        return t.startsWith("- ") || t.startsWith("• ");
                    });
                    if (allBullets) {
                        html.push("<ul>");
                        lines.forEach(function(l) {
                            var t = l.trim().replace(/^(- |• )/, "");
                            html.push("<li>" + escapeHtml(t) + "</li>");
                        });
                        html.push("</ul>");
                    } else {
                        // Paragraph: keep single newlines as <br>
                        html.push("<p>" + escapeHtml(block).replace(/\n/g, "<br>") + "</p>");
                    }
                }

                return html.join("");
            }

            var contentEl = document.createElement("div");
            contentEl.innerHTML = renderArticleBody(a.content);
            body.appendChild(contentEl);
            content.style.display = "block";
            document.title = (a.title || "Статия") + " - Да учим с Бъни";
        })
        .catch(function() {
            loading.style.display = "none";
            var host = window.location.hostname;
            error.textContent = "Грешка при зареждане. Уверете се, че backend работи на " + host + ":4000 (същият хост като страницата).";
            error.style.display = "block";
        });
})();
</script>

</body>
</html>
