<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Вход - Да учим с Бъни</title>
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo-area">
        <img src="assets/images/logo.png" alt="Лого Бъни" class="logo">
    </div>
    <!-- Nav ще се зарежда според ролята -->
    <nav class="nav" id="nav"></nav>
</header>

<section class="login-section">
    <div class="white-card form-card">
        <h2>Вход</h2>

        <!-- Добавяме onsubmit -->
        <form onsubmit="event.preventDefault(); loginUser();">
            <div class="form-group">
                <label>Имейл</label>
                <input type="email" id="email" placeholder="Въведи имейл" required>
            </div>
            <div class="form-group">
                <label>Парола</label>
                <input type="password" id="password" placeholder="Въведи парола" required>
            </div>
            <button type="submit" class="btn">Вход</button>
            <div id="login-message" style="margin-top: 10px;"></div>
        </form>

        <p>Нямаш акаунт? <a href="register.html">Регистрация</a></p>
    </div>
</section>

<footer>
    <p>© 2026 Да учим с Бъни</p>
</footer>

<!-- JS -->
<script src="js/auth.js"></script>

<script>
/* Меню според ролята */
const role = getRole();
const nav = document.getElementById("nav");

if (role === "guest") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="login.html" class="active">Вход</a>
        <a href="register.html">Регистрация</a>
    `;
}

if (role === "user") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="#" onclick="logout()">Изход</a>
    `;
}

if (role === "admin") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="admin.html">Админ панел</a>
        <a href="#" onclick="logout()">Изход</a>
    `;
}

/* Вход чрез API */
async function loginUser() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const messageDiv = document.getElementById("login-message");

    messageDiv.textContent = "Влизане...";
    messageDiv.style.color = "blue";

    try {
        const response = await fetch("http://localhost:4000/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "Грешен имейл или парола");
        }

        // Успешен вход
        messageDiv.textContent = "Успешен вход!";
        messageDiv.style.color = "green";

        // Запазване на токена и данните за потребителя
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("role", data.user.role);

        // Пренасочване след 1 секунда
        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);

    } catch (error) {
        console.error("Login error:", error);
        messageDiv.textContent = "Грешка: " + error.message;
        messageDiv.style.color = "red";
    }
}
</script>

</body>
</html>
