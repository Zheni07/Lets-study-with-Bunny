<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Да учим с Бъни</title>
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo-area">
        <img src="assets/images/logo.png" alt="Лого Бъни" class="logo">
    </div>
    <!-- Навигацията ще се зарежда според ролята -->
    <nav class="nav" id="nav"></nav>
</header>

<section class="register-section">
    <div class="white-card form-card">
        <h2>Регистрация</h2>

        <!-- Добавяме onsubmit -->
        <form onsubmit="event.preventDefault(); registerUser();">
            <div class="form-group">
                <label>Име</label>
                <input type="text" id="username" placeholder="Въведи име" required>
            </div>
            <div class="form-group">
                <label>Имейл</label>
                <input type="email" id="email" placeholder="Въведи имейл" required>
            </div>
            <div class="form-group">
                <label>Парола</label>
                <input type="password" id="password" placeholder="Въведи парола" required>
            </div>
            <button type="submit" class="btn">Регистрация</button>
            <div id="register-message" style="margin-top: 10px;"></div>
        </form>

        <p>Вече имаш акаунт? <a href="login.html">Вход</a></p>
    </div>
</section>

<footer>
    <p>© 2026 Да учим с Бъни</p>
</footer>

<!-- JS -->
<script src="js/auth.js"></script>

<script>
/* Меню според ролята */
const role = getRole();
const nav = document.getElementById("nav");

if (role === "guest") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="login.html">Вход</a>
        <a href="register.html" class="active">Регистрация</a>
    `;
}

if (role === "user") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="#" onclick="logout()">Изход</a>
    `;
}

if (role === "admin") {
    nav.innerHTML = `
        <a href="index.html">Начало</a>
        <a href="games.html">Игри</a>
        <a href="admin.html">Админ панел</a>
        <a href="#" onclick="logout()">Изход</a>
    `;
}

/* Регистрация чрез API */
async function registerUser() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const messageDiv = document.getElementById("register-message");

    messageDiv.textContent = "Регистриране...";
    messageDiv.style.color = "blue";

    try {
        console.log("Sending registration request:", { username, email, password: "***" });
        
        const response = await fetch("http://localhost:4000/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, email, password }),
        });

        console.log("Response status:", response.status);
        console.log("Response headers:", response.headers);

        let data;
        try {
            data = await response.json();
            console.log("Response data:", data);
        } catch (parseError) {
            console.error("Failed to parse JSON:", parseError);
            const text = await response.text();
            console.error("Response text:", text);
            throw new Error("Невалиден отговор от сървъра");
        }

        if (!response.ok) {
            const errorMsg = data.error?.message || data.message || "Грешка при регистрация";
            console.error("Registration failed:", errorMsg);
            throw new Error(errorMsg);
        }

        // Успешна регистрация
        console.log("Registration successful:", data);
        messageDiv.textContent = "Успешна регистрация!";
        messageDiv.style.color = "green";

        // Запазване на токена и данните за потребителя
        if (data.token) {
            localStorage.setItem("token", data.token);
        }
        if (data.user) {
            localStorage.setItem("user", JSON.stringify(data.user));
            localStorage.setItem("role", data.user.role);
        }

        // Пренасочване след 1 секунда
        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);

    } catch (error) {
        console.error("Registration error:", error);
        
        // Check if it's a network error
        if (error.message === "Failed to fetch" || error.name === "TypeError") {
            messageDiv.textContent = "Грешка: Не може да се свърже със сървъра. Проверете дали backend-ът работи на http://localhost:4000";
        } else {
            messageDiv.textContent = "Грешка: " + error.message;
        }
        messageDiv.style.color = "red";
    }
}
</script>

</body>
</html>
